[sssd]
services = nss, pam
domains = dominio.com

[domain/dominio.com]
ldap_tls_cert = caminho/do/certificado
ldap_tls_key = caminho/da/chave
ldap_uri = XXXXXXXXXXXXX
ldap_search_base = dc=dominio,dc=com,dc=br
id_provider = ldap
