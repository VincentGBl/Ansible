---
- name: Instalar Ollama no Ubuntu 26.04
  hosts: "{{ target | default('null') }}"
  become: true
  tasks:


    - name: Garantir que as dependências básicas estão instaladas
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: yes

    - name: Baixar e executar o script de instalação oficial do Ollama
      ansible.builtin.shell: |
        curl -fsSL https://ollama.com/install.sh | sh
      args:
        creates: /usr/local/bin/ollama

    - name: Garantir que o serviço do Ollama está parado e desabilitado no boot
      ansible.builtin.systemd:
        name: ollama
        state: stopped
        enabled: no

    - name: Verificar versão instalada do Ollama
      ansible.builtin.command: ollama --version
      register: ollama_version
      changed_when: false

    - name: Mostrar a versão instalada
      ansible.builtin.debug:
        msg: "Ollama instalado com sucesso! {{ ollama_version.stdout }}"
