---
- name: Configurar Ambiente Conda Compartilhado e Substituir Skel .bashrc
  hosts: "{{ target | default('null') }}"
  become: yes
  vars:
    anaconda_installer: "preencha com a versão correspondente"
    anaconda_url: "https://repo.anaconda.com/archive/{{ anaconda_installer }}"
    install_dir: "/opt/anaconda3"
    env_name: "ambiente_aluno"
    packages:
      - "python=3.13"
      - "numpy"
      - "scipy"
      - "pandas"
      - "altair"
      - "matplotlib"
      - "statsmodels"
      - "scikit-learn"
      - "jupyter"
      - "ipykernel"
      - "r-base"
      - "r-tidyverse"
    sage_env_name: "ambiente_sagemath"
    sage_packages:
      - "python=3.12"
      - "sage"
      - "jupyter"
      - "ipykernel"

  tasks:
    - name: Garantir dependências iniciais instaladas (wget)
      ansible.builtin.package:
        name: wget
        state: present

    - name: Baixar o instalador do Anaconda
      ansible.builtin.get_url:
        url: "{{ anaconda_url }}"
        dest: "/tmp/{{ anaconda_installer }}"
        mode: '0755'

    - name: Criar diretório de instalação do Anaconda
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Executar o instalador do Anaconda em modo silencioso
      ansible.builtin.command:
        cmd: "bash /tmp/{{ anaconda_installer }} -b -u -p {{ install_dir }}"
        creates: "{{ install_dir }}/bin/conda"

    - name: Criar o ambiente Conda compartilhado com os pacotes
      ansible.builtin.command:
        cmd: "{{ install_dir }}/bin/conda create -n {{ env_name }} -c conda-forge {{ packages | join(' ') }} -y"
        creates: "{{ install_dir }}/envs/{{ env_name }}"

    - name: Registrar o Kernel globalmente no Jupyter
      ansible.builtin.command:
        cmd: "{{ install_dir }}/envs/{{ env_name }}/bin/python -m ipykernel install --name {{ env_name }} --display-name 'Python (Ambiente Aluno)' --prefix={{ install_dir }}"
        creates: "{{ install_dir }}/share/jupyter/kernels/{{ env_name }}"

    - name: Criar o ambiente Conda com SageMath
      ansible.builtin.command:
        cmd: "{{ install_dir }}/bin/conda create -n {{ sage_env_name }} -c conda-forge {{ sage_packages | join(' ') }} -y"
        creates: "{{ install_dir }}/envs/{{ sage_env_name }}"

    - name: Registrar o Kernel do SageMath no Jupyter
      ansible.builtin.command:
        cmd: "{{ install_dir }}/envs/{{ sage_env_name }}/bin/python -m ipykernel install --name {{ sage_env_name }} --display-name 'SageMath' --prefix={{ install_dir }}"
        creates: "{{ install_dir }}/share/jupyter/kernels/{{ sage_env_name }}"

    - name: Configurar permissões de somente-leitura (Segurança)
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        recurse: yes
        owner: root
        group: root
        mode: 'u=rwX,g=rX,o=rX'

    - name: SOBREESCREVER o /etc/skel/.bashrc exatamente com o conteúdo completo solicitado
      ansible.builtin.copy:
        dest: /etc/skel/.bashrc
        owner: root
        group: root
        mode: '0644'
        content: |
          # ~/.bashrc: executed by bash(1) for non-login shells.
          # see /usr/share/doc/bash/examples/startup-files (in the package bash-doc)
          # for examples

          # If not running interactively, don't do anything
          case $- in
              *i*) ;;
                *) return;;
          esac

          # don't put duplicate lines or lines starting with space in the history.
          # See bash(1) for more options
          HISTCONTROL=ignoreboth

          # append to the history file, don't overwrite it
          shopt -s histappend

          # for setting history length see HISTSIZE and HISTFILESIZE in bash(1)
          HISTSIZE=1000
          HISTFILESIZE=2000

          # check the window size after each command and, if necessary,
          # update the values of LINES and COLUMNS.
          shopt -s checkwinsize

          # If set, the pattern "**" used in a pathname expansion context will
          # match all files and zero or more directories and subdirectories.
          #shopt -s globstar

          # make less more friendly for non-text input files, see lesspipe(1)
          [ -x /usr/bin/lesspipe ] && eval "$(SHELL=/bin/sh lesspipe)"

          # set variable identifying the chroot you work in (used in the prompt below)
          if [ -z "${debian_chroot:-}" ] && [ -r /etc/debian_chroot ]; then
              debian_chroot=$(cat /etc/debian_chroot)
          fi

          # set a fancy prompt (non-color, unless we know we "want" color)
          case "$TERM" in
              xterm-color|*-256color) color_prompt=yes;;
          esac

          # uncomment for a colored prompt, if the terminal has the capability; turned
          # off by default to not distract the user: the focus in a terminal window
          # should be on the output of commands, not on the prompt
          #force_color_prompt=yes

          if [ -n "$force_color_prompt" ]; then
              if [ -x /usr/bin/tput ] && tput setaf 1 >&/dev/null; then
          	# We have color support; assume it's compliant with Ecma-48
          	# (ISO/IEC-6429). (Lack of such support is extremely rare, and such
          	# a case would tend to support setf rather than setaf.)
          	color_prompt=yes
              else
          	color_prompt=
              fi
          fi

          if [ "$color_prompt" = yes ]; then
              PS1='${debian_chroot:+($debian_chroot)}\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
          else
              PS1='${debian_chroot:+($debian_chroot)}\u@\h:\w\$ '
          fi
          unset color_prompt force_color_prompt

          # If this is an xterm set the title to user@host:dir
          case "$TERM" in
          xterm*|rxvt*)
              PS1="\[\e]0;${debian_chroot:+($debian_chroot)}\u@\h: \w\a\]$PS1"
              ;;
          *)
              ;;
          esac

          # enable color support of ls and also add handy aliases
          if [ -x /usr/bin/dircolors ]; then
              test -r ~/.dircolors && eval "$(dircolors -b ~/.dircolors)" || eval "$(dircolors -b)"
              alias ls='ls --color=auto'
              #alias dir='dir --color=auto'
              #alias vdir='vdir --color=auto'

              alias grep='grep --color=auto'
              alias fgrep='fgrep --color=auto'
              alias egrep='egrep --color=auto'
          fi

          # colored GCC warnings and errors
          #export GCC_COLORS='error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01'

          # some more ls aliases
          alias ll='ls -alF'
          alias la='ls -A'
          alias l='ls -CF'

          # Add an "alert" alias for long running commands.  Use like so:
          #   sleep 10; alert
          alias alert='notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e '\''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'\'')"'

          # Alias definitions.
          # You may want to put all your additions into a separate file like
          # ~/.bash_aliases, instead of adding them here directly.
          # See /usr/share/doc/bash-doc/examples in the bash-doc package.

          if [ -f ~/.bash_aliases ]; then
              . ~/.bash_aliases
          fi

          # enable programmable completion features (you don't need to enable
          # this, if it's already enabled in /etc/bash.bashrc and /etc/profile
          # sources /etc/bash.bashrc).
          if ! shopt -oq posix; then
            if [ -f /usr/share/bash-completion/bash_completion ]; then
              . /usr/share/bash-completion/bash_completion
            elif [ -f /etc/bash_completion ]; then
              . /etc/bash_completion
            fi
          fi

          #########################################################
          # Configuração do Ambiente Compartilhado (Otimizada)
          #########################################################

          # Função para evitar erro caso não exista o comando log no bash padrão
          log() { echo "[CONDA-LOG]: $1"; }

          CENTRAL_CONDA="{{ install_dir }}"
          ENV_NAME="{{ env_name }}"

          # Garante que o Jupyter enxergue os kernels registrados no prefixo central
          # (/opt/anaconda3/share/jupyter/kernels), não importa qual ambiente conda
          # esteja ativo no momento (base, ambiente_aluno, etc.)
          export JUPYTER_PATH="$CENTRAL_CONDA/share/jupyter:$JUPYTER_PATH"

          # 1. Verifica se a instalação central existe
          if [ -d "$CENTRAL_CONDA" ]; then
              # Ativa o Conda central
              source "$CENTRAL_CONDA/etc/profile.d/conda.sh"
              
              # 2. Tenta ativar o ambiente compartilhado
              conda activate "$ENV_NAME" 2>/dev/null
              
              if [ $? -eq 0 ]; then
                  log "Ambiente compartilhado '$ENV_NAME' ativado com sucesso."
              else
                  # Fallback para o base caso o ambiente do aluno tenha problemas
                  conda activate base
                  log "AVISO: Usando ambiente base. '$ENV_NAME' não encontrado."
              fi
          else
              log "ERRO: Instalação central do Anaconda não encontrada em $CENTRAL_CONDA"
          fi

          # Manter os aliases úteis para o aluno
          alias notebook="cd ~/notebooks && jupyter notebook"
          alias check_pkgs="conda list"
          alias sagemath="conda activate {{ sage_env_name }} && sage"

          # Impede o pip de instalar pacotes na home do aluno caso o global esteja travado
          export PIP_USER=false
          export OLLAMA_MODELS=/mnt/storageY/.ollama_models
          alias meshlab="QT_QPA_PLATFORM=xcb meshlab"
