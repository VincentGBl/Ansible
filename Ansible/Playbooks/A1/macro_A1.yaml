---
- name: Orquestrador do Laboratório A1
  hosts: localhost
  gather_facts: false



- name: Executar Customização de papel de parede
  ansible.builtin.import_playbook: ../Micro_playbooks/Customizacao.yaml
  vars:
    target: Laboratorio_A1


- name: Executar Instalação do conda
  ansible.builtin.import_playbook: ../Micro_playbooks/conda_bashrc.yaml
  vars:
    target: Laboratorio_A1


- name: Instalar aplicativos APT e Snap
  ansible.builtin.import_playbook: ../Micro_playbooks/softwares_impatech.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar e Instalar Ollama
  ansible.builtin.import_playbook: ../Micro_playbooks/ollama.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar Google Workspace (LDAP)
  ansible.builtin.import_playbook: ../Micro_playbooks/workspace_A1.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar e instalar R (rstudio e bibliotecas também)
  ansible.builtin.import_playbook: ../Micro_playbooks/R.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar e Instalar Storage 1
  ansible.builtin.import_playbook: ../Micro_playbooks/storage_cliente1.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar e Instalar Storage 2
  ansible.builtin.import_playbook: ../Micro_playbooks/storage_cliente2.yaml
  vars:
    target: Laboratorio_A1


- name: Configurar Sistema de Avisos
  ansible.builtin.import_playbook: ../Micro_playbooks/Avisos.yaml
  vars:
    target: Laboratorio_A1

- name: Manutencar aviso
  ansible.builtin.import_playbook: ../Micro_playbooks/Manutencao_A1.yaml
  vars:
    target: Laboratorio_A1

- name: Configurações de Segurança
  ansible.builtin.import_playbook: ../Micro_playbooks/Seguranca.yaml
  vars:
    target: Laboratorio_A1